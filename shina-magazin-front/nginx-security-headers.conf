# Xavfsizlik sarlavhalari — har bir javobga (`always`: 4xx/5xx'da ham).
#
# nginx'da `add_header` meros bo'lib o'tmaydi: location o'zining add_header'iga ega bo'lsa,
# server darajasidagilar yo'qoladi. Shuning uchun bu snippet server blokida HAM,
# add_header ishlatadigan har bir location'da HAM include qilinadi.
#
# CSP izohi:
#  - style-src 'unsafe-inline': React/recharts/react-hot-toast inline style yozadi;
#    Google Fonts CSS'i fonts.googleapis.com'dan (index.css @import).
#  - img-src https:: brend logolari tashqi URL bo'lishi mumkin; blob:/data: — upload preview
#    va SVG placeholder'lar.
#  - connect-src wss:: SockJS/STOMP websocket (same-origin, lekin eski Safari uchun aniq).
#  - script-src faqat 'self': Vite build inline skript chiqarmaydi. Bu XSS'ning asosiy to'sig'i.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:" always;
