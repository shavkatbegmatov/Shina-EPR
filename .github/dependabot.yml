# Bog'liqliklarni avtomatik yangilash PR'lari.
#
# Ilgari hech qanday zaiflik kuzatuvi yo'q edi: npm audit 26 zaiflik (2 critical)
# ko'rsatgan, xlsx esa npm'da tashlab ketilgan versiyada qolgan — buni hech kim
# ko'rmasdi. Dependabot har hafta PR ochadi; CI (lint/test/build) ularni tekshiradi.
version: 2
updates:
  - package-ecosystem: npm
    directory: /shina-magazin-front
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    groups:
      # Minor/patch yangilanishlar bitta PR'da — 40 ta alohida PR shovqin bo'lardi
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major yangilanishlar qo'lda (React 19, DaisyUI 5, lucide 1.x — API o'zgaradi)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /shina-magazin-api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    groups:
      # Birinchi ishga tushishda 8 ta alohida PR ochildi (checkout, setup-java,
      # upload-artifact, docker/*...) — har biri o'z CI run'i bilan. Bitta PR yetarli.
      github-actions:
        patterns: ["*"]

  # Docker: Dockerfile'lardagi bazaviy image'lar (node 20, temurin 17, maven+temurin 17)
  # ATAYLAB shu major'da — backend Java 17 target, frontend Node 20 LTS. Major taklifi
  # (node 26, temurin 25/26) tekshirilmagan yangilanishdir; faqat minor/patch (xavfsizlik
  # tuzatishlari) PR bo'ladi.
  - package-ecosystem: docker
    directory: /shina-magazin-api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Build stage'ining `maven:3.9-eclipse-temurin-17-alpine` tegida Dependabot
      # "versiya"ni 3.9 deb o'qiydi, JDK raqami esa suffiks — shuning uchun yuqoridagi
      # semver-major qoidasi 17 → 26 ni USHLAMADI (#30, LTS bo'lmagan JDK 26). Build
      # JDK'si runtime (`eclipse-temurin:17-jre-alpine`) bilan bir xil qolishi kerak.
      # Teg suzuvchi: Maven 3.9.x va JDK 17 patch'lari har image build'ida baribir
      # keladi. Maven 3.10+ ga o'tish — mvnw wrapper bilan birga, qo'lda.
      - dependency-name: "maven"
  - package-ecosystem: docker
    directory: /shina-magazin-front
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
