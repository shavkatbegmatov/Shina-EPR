name: Coolify recover

# Prod tushib qolganda Coolify resursini QO'LDA tiklash: restart, yoki
# stop + start (to'liq qayta yaratish). Panelga kira olmasdan ham Actions'dan
# bosiladi — secret'lar ci.yml dagi bilan bir xil.
#
# Nega kerak: 06.09.2026 da deploy o'rtasida bekor qilingan run'dan keyin
# stack yarim holatda qoldi — keyingi deploy'lar Coolify'da "finished" bo'lsa
# ham backend ko'tarilmadi (nginx 502, 1.5+ soat). Coolify API deploy logini
# bermaydi (coolify-diagnose.yml), ya'ni yagona masofaviy vosita — stack'ni
# to'liq qayta ko'tarish.
#
# Bu workflow BUYURTMA BILAN ishlaydi (workflow_dispatch), o'zi hech qachon
# avtomatik yurmaydi.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "restart — qayta ishga tushirish; recreate — stop, so'ng start; stop / start — alohida (resurs almashtirishda)"
        type: choice
        options: [restart, recreate, stop, start]
        default: restart
      wait_seconds:
        description: "Sog'liqni necha soniya kutish"
        default: "300"

permissions:
  contents: read

concurrency:
  group: coolify-recover
  cancel-in-progress: false

jobs:
  recover:
    name: Coolify ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      ACTION: ${{ github.event.inputs.action }}
      WAIT: ${{ github.event.inputs.wait_seconds || '300' }}
      SITE_URL: ${{ vars.VITE_SITE_URL || 'https://protektor.uz' }}
    steps:
      - name: ${{ github.event.inputs.action }}
        run: |
          set -uo pipefail
          BASE=$(printf '%s' "$COOLIFY_WEBHOOK_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          UUID=$(printf '%s' "$COOLIFY_WEBHOOK_URL" | sed -nE 's#.*[?&]uuid=([^&]+).*#\1#p')
          [ -n "$UUID" ] || { echo "::error::COOLIFY_WEBHOOK_URL dan uuid ajratilmadi"; exit 1; }

          call() {  # call <METHOD> <yo'l>
            local out code
            out=$(curl -sS --max-time 60 -X "$1" -d '' -w '\n%{http_code}' \
                  -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$BASE$2") || true
            code=$(printf '%s' "$out" | tail -n1)
            echo "$1 $2 -> HTTP $code: $(printf '%s' "$out" | sed '$d' | head -c 400)"
            [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "202" ]
          }

          # Resurs turi: raw compose "Docker Compose Empty" — SERVICE, git'dan o'qiydigan
          # compose — APPLICATION. API yo'llari boshqacha; uuid bo'yicha aniqlaymiz.
          if curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$BASE/api/v1/services/$UUID" | grep -q '^200$'; then
            KIND=services
          else
            KIND=applications
          fi
          echo "resurs turi: $KIND ($UUID)"

          case "$ACTION" in
            restart)
              call POST "/api/v1/$KIND/$UUID/restart" || { echo "::error::restart so'rovi rad etildi"; exit 1; } ;;
            recreate)
              call POST "/api/v1/$KIND/$UUID/stop" || { echo "::error::stop so'rovi rad etildi"; exit 1; }
              echo "konteynerlar to'xtashi uchun 20 s..."; sleep 20
              call POST "/api/v1/$KIND/$UUID/start" || { echo "::error::start so'rovi rad etildi"; exit 1; } ;;
            stop)
              # Resurs almashtirishda: eski resurs to'xtatiladi, volume'lar qoladi.
              # Sog'liq ATAYLAB kutilmaydi — sayt shu paytda javob bermasligi kerak.
              call POST "/api/v1/$KIND/$UUID/stop" || { echo "::error::stop so'rovi rad etildi"; exit 1; }
              echo "::notice title=Resurs to'xtatildi::$UUID uchun stop so'rovi qabul qilindi"
              exit 0 ;;
            start)
              call POST "/api/v1/$KIND/$UUID/start" || { echo "::error::start so'rovi rad etildi"; exit 1; } ;;
            *) echo "::error::noma'lum action: $ACTION"; exit 1 ;;
          esac

          echo "Sog'liq kuzatuvi (${WAIT}s):"
          deadline=$(( SECONDS + WAIT ))
          while (( SECONDS < deadline )); do
            f=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/" || true)
            a=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/api/actuator/health" || true)
            echo "$(date -u +%H:%M:%S)  vitrina=$f  api=$a"
            if [ "$a" = "200" ]; then
              echo "::notice title=Prod tiklandi::$ACTION dan keyin backend 200 qaytardi"
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Prod tiklanmadi::$ACTION dan keyin ${WAIT}s ichida backend 200 bermadi (oxirgi: vitrina=$f api=$a). Serverda docker logs kerak."
          exit 1
