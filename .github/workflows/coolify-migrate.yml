name: Coolify migrate (raw compose)

# Git'dan o'qiydigan Application'dan RAW compose SERVICE'ga o'tish — bosqichma-bosqich,
# har bosqich alohida ishga tushiriladi va natijasi Actions'da ko'rinadi.
#
# Coolify 4.3 da "Docker Compose Empty" resurs SERVICE turida yaratiladi (UI'da,
# API'da bunday yaratish yo'li yo'q — 06.09.2026 probe: 404). Shuning uchun resursning
# o'zi UI'da yaratiladi, qolgan hammasi shu yerda:
#
#   probe    — faqat o'qiydi: eski app, yangi service (holat, sub-app'lar, domen),
#              yozish huquqi bor-yo'qligi.
#   prepare  — yangi service'ga compose (repodan) va env'lar (eski app'dan, token
#              read:sensitive bo'lsa; aks holda COOLIFY_MIGRATE_ENVS secret'idan). Deploy YO'Q.
#   cutover  — eski app'dan domen olinadi va u to'xtatiladi, yangi service deploy
#              qilinadi, sog'liq kuzatiladi (10–15 daqiqa to'xtash). Domen yangi
#              service'da OLDINDAN qo'yilgan bo'lishi kerak (probe tekshiradi).
#   rollback — yangi service to'xtatiladi, domen eski app'ga qaytariladi, u ishga tushadi.
#
# Ma'lumot: volume'lar compose'da mavjud nomlariga qadalgan (external) — yangi service
# eski bazaga va rasmlarga ulanadi. IKKALASI BIR VAQTDA ISHLAMASLIGI SHART.
#
# Sirlar: COOLIFY_WEBHOOK_URL (eski app uuid + Coolify manzili), COOLIFY_WRITE_TOKEN
# (read + read:sensitive + write + deploy), COOLIFY_MIGRATE_ENVS (ixtiyoriy zaxira).
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Bosqich"
        type: choice
        options: [probe, prepare, cutover, rollback]
        default: probe
      new_uuid:
        description: "Yangi SERVICE uuid (Coolify URL'dagi /service/<uuid>)"
        default: "hi3x8b45gvbqslhrcqh6eggu"

permissions:
  contents: read

concurrency:
  group: coolify-migrate
  cancel-in-progress: false

env:
  DOMAINS: "https://protektor.uz,https://www.protektor.uz"
  COMPOSE_FILE: infra/coolify/docker-compose.yml
  SITE_URL: ${{ vars.VITE_SITE_URL || 'https://protektor.uz' }}

jobs:
  migrate:
    name: ${{ github.event.inputs.phase }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN || secrets.COOLIFY_API_TOKEN }}
      COOLIFY_MIGRATE_ENVS: ${{ secrets.COOLIFY_MIGRATE_ENVS }}
      PHASE: ${{ github.event.inputs.phase }}
      NEW: ${{ github.event.inputs.new_uuid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tayyorgarlik
        run: |
          set -uo pipefail
          BASE=$(printf '%s' "$COOLIFY_WEBHOOK_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          OLD=$(printf '%s' "$COOLIFY_WEBHOOK_URL" | sed -nE 's#.*[?&]uuid=([^&]+).*#\1#p')
          [ -n "$OLD" ] || { echo "::error::COOLIFY_WEBHOOK_URL dan eski uuid ajratilmadi"; exit 1; }
          [ -n "$NEW" ] || { echo "::error::new_uuid kerak"; exit 1; }
          [ -f "$COMPOSE_FILE" ] || { echo "::error::$COMPOSE_FILE topilmadi"; exit 1; }
          { echo "BASE=$BASE"; echo "OLD=$OLD"; } >> "$GITHUB_ENV"
          # Umumiy funksiyalar — keyingi qadamlar `source` qiladi
          cat > "$RUNNER_TEMP/lib.sh" <<'LIB'
          api() { # api METHOD PATH [JSON] -> CODE, BODY
            local m="$1" p="$2" d="${3:-}" out
            if [ -n "$d" ]; then
              out=$(curl -sS --max-time 60 -X "$m" -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" --data-binary "$d" -w '\n%{http_code}' "$BASE$p") || out=$'\n000'
            else
              out=$(curl -sS --max-time 60 -X "$m" -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Accept: application/json" -w '\n%{http_code}' "$BASE$p") || out=$'\n000'
            fi
            CODE=$(printf '%s' "$out" | tail -n1); BODY=$(printf '%s' "$out" | sed '$d')
          }
          ok() { case "$CODE" in 200|201|202) return 0;; *) return 1;; esac; }
          short() { printf '%s' "$BODY" | tr '\n' ' ' | sed -E 's/"value":"[^"]*"/"value":"***"/g' | head -c "${1:-200}"; }
          health() { # health -> 0 agar vitrina va API 200
            local f a
            f=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/" || true)
            a=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/api/actuator/health" || true)
            echo "$(date -u +%H:%M:%S)  vitrina=$f  api=$a"
            [ "$f" = "200" ] && [ "$a" = "200" ]
          }
          LIB
          echo "eski app: $OLD  yangi service: $NEW"

      - name: probe — faqat o'qish
        if: env.PHASE == 'probe'
        run: |
          set -uo pipefail; source "$RUNNER_TEMP/lib.sh"
          echo "### Eski app"
          api GET "/api/v1/applications/$OLD"; echo "HTTP $CODE"
          printf '%s' "$BODY" | jq -r '{name, status, build_pack, ports_exposes, docker_compose_domains}' 2>/dev/null
          echo "### Yangi service"
          api GET "/api/v1/services/$NEW"; echo "HTTP $CODE"
          printf '%s' "$BODY" | jq -r '{name, status, server_status, docker_compose_raw_len: ((.docker_compose_raw // "")|length), applications: ((.applications // []) | map({name, uuid, fqdn, status, image})), databases: ((.databases // []) | map({name, uuid, status, image})), connect_to_docker_network}' 2>/dev/null || short 600
          echo "### Yangi service env kalitlari"
          api GET "/api/v1/services/$NEW/envs"; echo "HTTP $CODE"
          printf '%s' "$BODY" | jq -r 'if type=="array" then .[] | "\(.key)  value_len=\(((.real_value // .value // "")|length))" else . end' 2>/dev/null | head -40
          echo "### Eski app env qiymatlari ko'rinadimi (read:sensitive)"
          api GET "/api/v1/applications/$OLD/envs"; echo "HTTP $CODE"
          printf '%s' "$BODY" | jq -r 'if type=="array" then "qiymati bor: \([.[] | select(((.real_value // .value // "")|length) > 0)] | length) / \(length)" else . end' 2>/dev/null
          echo "### Yozish huquqi (bo'sh PATCH: 200/422 = bor, 403 = yo'q)"
          api PATCH "/api/v1/services/$NEW" '{}'; echo "PATCH services/$NEW -> HTTP $CODE: $(short 160)"
          api PATCH "/api/v1/applications/$OLD" '{}'; echo "PATCH applications/$OLD -> HTTP $CODE: $(short 160)"
          echo "### Service sub-app domen endpointi bormi"
          APP=$(printf '%s' "$BODY" | jq -r 'empty'); api GET "/api/v1/services/$NEW"
          FRONT=$(printf '%s' "$BODY" | jq -r '(.applications // []) | map(select(.name=="frontend")) | .[0].uuid // empty')
          echo "frontend sub-app uuid: ${FRONT:-<topilmadi>}"
          if [ -n "$FRONT" ]; then
            api PATCH "/api/v1/services/$NEW/applications/$FRONT" '{}'; echo "PATCH services/$NEW/applications/$FRONT -> HTTP $CODE: $(short 160)"
          fi

      - name: prepare — compose va env'lar yangi service'ga (deploy yo'q)
        if: env.PHASE == 'prepare'
        run: |
          set -uo pipefail; source "$RUNNER_TEMP/lib.sh"
          api GET "/api/v1/services/$NEW"; ok || { echo "::error::yangi service topilmadi (HTTP $CODE)"; exit 1; }
          ST=$(printf '%s' "$BODY" | jq -r '.status // ""'); echo "yangi service holati: $ST"
          case "$ST" in running*) echo "::error::Yangi service ISHLAYAPTI — eski baza bilan bir vaqtda bo'lmasligi kerak. Avval UI'da Stop qiling."; exit 1;; esac

          echo "1) compose"
          # Service GET'i docker_compose_raw ni qaytarmaydi (probe: len=0), shuning uchun
          # tekshiruv PATCH javobi va sub-app ro'yxati bo'yicha: compose to'g'ri
          # o'qilsa backend/frontend/db o'z joyida qoladi.
          api PATCH "/api/v1/services/$NEW" "$(jq -n --rawfile c "$COMPOSE_FILE" '{docker_compose_raw:$c}')"
          echo "   PATCH (xom matn) -> HTTP $CODE: $(short 200)"
          [ "$CODE" = "403" ] && { echo "::error::Yozish huquqi yo'q — COOLIFY_WRITE_TOKEN (write) kerak"; exit 1; }
          if ! ok; then
            api PATCH "/api/v1/services/$NEW" "$(jq -n --arg c "$(base64 -w0 "$COMPOSE_FILE")" '{docker_compose_raw:$c}')"
            echo "   PATCH (base64) -> HTTP $CODE: $(short 200)"
            ok || { echo "::error::compose yuborilmadi"; exit 1; }
          fi
          api GET "/api/v1/services/$NEW"
          echo "   sub-app'lar: $(printf '%s' "$BODY" | jq -r '[(.applications // [])[].name, (.databases // [])[].name] | join(", ")')"
          for s in backend frontend db; do
            printf '%s' "$BODY" | jq -e --arg s "$s" '([(.applications // [])[].name, (.databases // [])[].name] | index($s)) != null' >/dev/null \
              || { echo "::error::compose yuborilgach $s servisi yo'qoldi — compose noto'g'ri o'qildi"; exit 1; }
          done

          echo "2) env'lar"
          api GET "/api/v1/applications/$OLD/envs"
          FROM_OLD=$(printf '%s' "$BODY" | jq -c 'if type=="array" then [ .[] | select(.is_preview != true) | select(.key | test("^(SERVICE_|BACKUP_KEEP_DAYS$)") | not) | {key, value: (.real_value // .value // ""), is_preview:false, is_build_time:false, is_literal:false} ] | map(select(.value != "")) else [] end' 2>/dev/null || echo '[]')
          N=$(printf '%s' "$FROM_OLD" | jq 'length')
          if [ "$N" -gt 0 ]; then
            echo "   eski app'dan $N ta qiymat (read:sensitive)"; DATA=$(printf '%s' "$FROM_OLD" | jq '{data: .}')
          elif [ -n "${COOLIFY_MIGRATE_ENVS:-}" ]; then
            DATA=$(printf '%s\n' "$COOLIFY_MIGRATE_ENVS" | tr -d '\r' | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' \
                   | jq -Rn '[inputs | capture("^(?<key>[A-Za-z_][A-Za-z0-9_]*)=(?<value>.*)$") | {key, value, is_preview:false, is_build_time:false, is_literal:false}] | {data: .}')
            echo "   COOLIFY_MIGRATE_ENVS dan $(printf '%s' "$DATA" | jq '.data|length') ta"
          else
            echo "::error title=Env qiymatlari yo'q::Token read:sensitive emas va COOLIFY_MIGRATE_ENVS ham yo'q"; exit 1
          fi
          # Service'da envs/bulk yo'q (404). Kalitlar compose'dan allaqachon yaratilgan —
          # har biri alohida: avval PATCH (mavjudni yangilash), bo'lmasa POST (yaratish).
          # Qiymat hech qachon chiqarilmaydi.
          FAILED=0
          while IFS= read -r item; do
            k=$(printf '%s' "$item" | jq -r '.key')
            api PATCH "/api/v1/services/$NEW/envs" "$item"
            if ! ok; then
              api POST "/api/v1/services/$NEW/envs" "$item"
            fi
            if ok; then echo "   $k: OK ($CODE)"; else echo "   $k: XATO HTTP $CODE $(short 120)"; FAILED=$((FAILED+1)); fi
          done < <(printf '%s' "$DATA" | jq -c '.data[]')
          [ "$FAILED" = "0" ] || { echo "::error::$FAILED ta env qo'yilmadi"; exit 1; }
          api GET "/api/v1/services/$NEW/envs"
          echo "   yangi service kalitlari:"; printf '%s' "$BODY" | jq -r 'if type=="array" then .[] | .key else empty end' | sort -u | tr '\n' ' '; echo
          for k in DB_PASSWORD JWT_SECRET; do
            printf '%s' "$BODY" | jq -e --arg k "$k" 'if type=="array" then any(.[]; .key==$k) else false end' >/dev/null || { echo "::error::majburiy $k yo'q"; exit 1; }
          done
          echo "3) domen"
          api GET "/api/v1/services/$NEW"
          FQDN=$(printf '%s' "$BODY" | jq -r '(.applications // []) | map(select(.name=="frontend")) | .[0].fqdn // ""')
          echo "   frontend fqdn: ${FQDN:-(hali yoq)}"
          if [ -z "$FQDN" ]; then
            echo "::warning title=Domen hali yo'q::Cutover'dan oldin UI'da: yangi service → frontend (tishli belgi) → Domains: $DOMAINS. Coolify eski app'da turgan domenni rad etsa — cutover uni avval eski app'dan oladi, keyin qayta urinasiz."
          fi
          echo "::notice title=prepare tugadi::Keyingi bosqich: cutover (savdo bo'lmagan vaqtda)"

      - name: cutover — eskini to'xtatib, yangini ishga tushirish
        if: env.PHASE == 'cutover'
        run: |
          set -uo pipefail; source "$RUNNER_TEMP/lib.sh"
          api GET "/api/v1/services/$NEW"; ok || { echo "::error::yangi service topilmadi"; exit 1; }
          FQDN=$(printf '%s' "$BODY" | jq -r '(.applications // []) | map(select(.name=="frontend")) | .[0].fqdn // ""')
          api GET "/api/v1/services/$NEW/envs"
          for k in DB_PASSWORD JWT_SECRET; do
            printf '%s' "$BODY" | jq -e --arg k "$k" 'if type=="array" then any(.[]; .key==$k) else false end' >/dev/null || { echo "::error::yangi service'da $k yo'q — avval prepare"; exit 1; }
          done
          echo "1) eski app'dan domen olinadi"
          api PATCH "/api/v1/applications/$OLD" '{"docker_compose_domains":"{}"}'; echo "   HTTP $CODE: $(short 120)"
          echo "2) eski app to'xtatiladi"
          api POST "/api/v1/applications/$OLD/stop"; echo "   HTTP $CODE: $(short 120)"; ok || { echo "::error::eski app to'xtatilmadi"; exit 1; }
          sleep 25
          if [ -z "$FQDN" ]; then
            echo "3) yangi service frontend'iga domen (API)"
            api GET "/api/v1/services/$NEW"
            FRONT=$(printf '%s' "$BODY" | jq -r '(.applications // []) | map(select(.name=="frontend")) | .[0].uuid // empty')
            [ -n "$FRONT" ] || { echo "::error::frontend sub-app topilmadi — rollback qiling"; exit 1; }
            for field in fqdn domains; do
              api PATCH "/api/v1/services/$NEW/applications/$FRONT" "$(jq -n --arg d "$DOMAINS" --arg f "$field" '{($f): $d}')"
              echo "   PATCH {$field} -> HTTP $CODE: $(short 160)"
              api GET "/api/v1/services/$NEW"
              FQDN=$(printf '%s' "$BODY" | jq -r '(.applications // []) | map(select(.name=="frontend")) | .[0].fqdn // ""')
              [ -n "$FQDN" ] && break
            done
            echo "   frontend fqdn: ${FQDN:-(qoyilmadi)}"
            if [ -z "$FQDN" ]; then
              echo "::warning title=Domen API orqali qo'yilmadi::UI'da yangi service → frontend → Domains: $DOMAINS ni saqlang va Deploy bosing (eski app'dan olingan, rad etilmaydi). Bu workflow 12 daqiqa sog'liqni kuzatadi."
            fi
          fi
          if [ -n "$FQDN" ]; then
            echo "4) yangi service deploy"
            api POST "/api/v1/deploy?uuid=$NEW"; echo "   HTTP $CODE: $(short 200)"; ok || { echo "::error::deploy boshlanmadi — rollback qiling"; exit 1; }
          fi
          for i in $(seq 1 48); do
            if health; then
              echo "::notice title=Cutover muvaffaqiyatli::Yangi service $NEW jonli. Endi: GitHub secret COOLIFY_WEBHOOK_URL=$BASE/api/v1/deploy?uuid=$NEW, Variable COOLIFY_SYNC_COMPOSE=true."
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Cutover tugallanmadi::12 daqiqada 200 kelmadi — rollback bosqichini ishga tushiring"; exit 1

      - name: rollback — eski app'ga qaytish
        if: env.PHASE == 'rollback'
        run: |
          set -uo pipefail; source "$RUNNER_TEMP/lib.sh"
          DOMJSON=$(jq -n --arg d "$DOMAINS" '{frontend:{domain:$d}} | tostring')
          echo "1) yangi service to'xtatiladi"; api POST "/api/v1/services/$NEW/stop"; echo "   HTTP $CODE: $(short 120)"
          sleep 20
          echo "2) domen eski app'ga"; api PATCH "/api/v1/applications/$OLD" "$(jq -n --arg j "$DOMJSON" '{docker_compose_domains:$j}')"; echo "   HTTP $CODE: $(short 120)"
          echo "3) eski app ishga tushadi"; api POST "/api/v1/applications/$OLD/start"; echo "   HTTP $CODE: $(short 160)"
          for i in $(seq 1 40); do health && { echo "::notice::Rollback muvaffaqiyatli — eski app jonli"; exit 0; }; sleep 15; done
          echo "::error::Rollback: 10 daqiqada 200 kelmadi"; exit 1
