name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Bir vaqtda bitta run: keyingi push oldingisini KUTADI (navbatda faqat eng
# oxirgisi qoladi). Ishlab turgan run faqat pull request uchun bekor qilinadi.
#
# Ilgari `cancel-in-progress: true` hamma uchun edi. 06.09.2026 da bir push'dan
# keyin darhol uchta merge qilindi — birinchi run DEPLOY O'RTASIDA bekor qilindi,
# Coolify stack'i yarim holatda qoldi va keyingi deploy'lar "finished" bo'lsa ham
# backend ko'tarilmadi (prod ~1 soat 502). Master'da yarim qolgan deploy'dan
# ko'ra bir necha daqiqa kutish arzon.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default: faqat o'qish. Yozish huquqi kerak bo'lgan job'lar o'zida so'raydi.
# Ilgari bu blok faqat build-and-push'da bor edi, qolganlari repo default'ini
# (ko'pincha read-write) meros olardi.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/shavkatbegmatov/shina-epr

# Action'lar tegga emas, COMMIT SHA'ga bog'langan (Dependabot yangilab turadi):
# ko'chma teg (v4) egasi tomonidan qayta yozilishi mumkin, SHA — yo'q.
jobs:
  # ── CI: Frontend lint + test + build ──
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shina-magazin-front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shina-magazin-front/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Frontend PermissionCode xaritasi backend enum bilan mos ekanini tekshiradi
      - run: npm run check:permissions
      # Faqat PROD bog'liqliklaridagi high/critical zaifliklar CI'ni to'xtatadi
      # (dev-only advisory'lar deploy'ni bloklamasin)
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  # ── CI: Backend compile + test ──
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shina-magazin-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Testcontainers Docker Hub'dan `postgres:16-alpine` tortadi. Hub anonim
      # pull'ni IP bo'yicha cheklaydi (6 soatda 100), GitHub runner'lari esa IP
      # pulini BO'LISHADI — 03.09.2026 da Dependabot 11 ta PR ochib, o'nlab run
      # bir vaqtda shu image'ni tortdi va backend testi ketma-ket yiqildi.
      # Oldindan, 3 marta urinib tortamiz: cheklovga tushsak, sabab TEST emasligi
      # shu qadamda ko'rinadi (annotatsiya), maven bosqichi esa kesh'dan ishlaydi.
      - name: Postgres image (Testcontainers uchun)
        run: |
          for i in 1 2 3; do
            if docker pull --quiet postgres:16-alpine; then exit 0; fi
            echo "::warning title=Docker pull urinishi $i yiqildi::postgres:16-alpine tortilmadi, 20 s dan keyin qayta urinamiz."
            sleep 20
          done
          echo "::error title=Docker Hub image tortilmadi::postgres:16-alpine 3 urinishda ham kelmadi (ehtimol Hub pull limiti). Testlar emas, muhit yiqildi."
          exit 1
      # Testlar CI'da ISHLASHI shart: xavfsizlik qorovul testlari (avtorizatsiya
      # qamrovi, JWT kalit validatsiyasi, Click imzo tekshiruvi) faqat shu yerda
      # regressiyani ushlay oladi. Ko'pchilik testlar H2 in-memory'da;
      # PostgresMigrationTest esa Testcontainers bilan HAQIQIY Postgres'da
      # migratsiyalarni qo'llaydi (runner'da Docker bor).
      #
      # RYUK (Testcontainers'ning tozalovchi konteyneri) o'chirilgan: u Hub'dan
      # YANA bitta image tortadi, runner esa har run'da yangi va o'zi yo'q bo'ladi
      # — tozalash uchun ryuk kerak emas, pull limitiga esa bosim ikki barobar.
      - name: Backend testlari
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: chmod +x mvnw && ./mvnw clean test -q
      # Qamrov hisoboti (JaCoCo) — Actions artefakti sifatida 14 kun saqlanadi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: shina-magazin-api/target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore
      # Yiqilganda surefire hisobotlari (qaysi test, qaysi assert, stack trace).
      # Job logini faqat repo admini ko'ra oladi va `-q` rejimida u qisqa; artefakt
      # esa run sahifasidan yuklab olinadi — 03.09.2026 da beqaror yiqilishning
      # sababini aynan shu bo'lmagani uchun aniqlab bo'lmadi.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: backend-surefire-reports
          path: shina-magazin-api/target/surefire-reports
          retention-days: 14
          if-no-files-found: ignore
      # Yiqilgan testni ANNOTATSIYA va job xulosasiga chiqaramiz. Job logini ham,
      # artefaktni ham faqat repo a'zosi ocha oladi; annotatsiya esa run sahifasida
      # darhol ko'rinadi va Checks API orqali ham o'qiladi — 03.09.2026 da sabab
      # aynan shu yetishmagani uchun ikki push davomida noma'lum qoldi.
      - name: Yiqilgan testlar xulosasi
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for f in target/surefire-reports/*.txt; do
            grep -qE "FAILURE!|ERROR!" "$f" || continue
            found=1
            name=$(basename "$f" .txt)
            body=$(sed -n '1,40p' "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3000)
            echo "::error title=Test yiqildi: $name::$body"
            { echo "### $name"; echo '```'; sed -n '1,60p' "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          for d in target/surefire-reports/*.dumpstream; do
            found=1
            echo "::error title=Fork crash: $(basename "$d")::$(sed -n '1,20p' "$d" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-2000)"
          done
          if [ "$found" = "0" ]; then
            echo "::error title=Yiqilgan test topilmadi::surefire-reports bo'sh yoki yo'q — kompilyatsiya xatosi yoki muhit muammosi bo'lishi mumkin."
          fi

  # ── CD: Build Docker images + push to GHCR ──
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build & push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./shina-magazin-api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./shina-magazin-front
          push: true
          # OG/sitemap absolyut URL uchun — GitHub repo Variables'da VITE_SITE_URL bering (bo'sh = relativ)
          build-args: |
            VITE_SITE_URL=${{ vars.VITE_SITE_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-front:latest
            ${{ env.IMAGE_PREFIX }}-front:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ── Image zaiflik skaneri (hisobot rejimi) ──
  # Deploy'ni TO'XTATMAYDI (exit-code 0): base image'lardagi yangi CVE'lar har
  # hafta paydo bo'ladi va tuzatilmaganlari (ignore-unfixed) deploy'ni bloklashi
  # ma'nosiz. Natija job logida; jiddiy topilma bo'lsa Dependabot/base image yangilanadi.
  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, front]
    steps:
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

  # ── CD: Trigger Coolify deploy ──
  # Coolify'da BITTA Compose resurs (infra/coolify/docker-compose.yml) turadi —
  # webhook butun stack'ni qayta deploy qiladi (yangi GHCR image'lar tortiladi).
  # Webhook image'lar push bo'lgandan KEYIN chaqiriladi — eski image tortilib
  # qolish poygasi yo'q (Coolify'ning push-ga bog'langan Auto Deploy'idan farqli).
  #
  # Ilgari bu qadam webhook'ni chaqirib, javobni KUTMASDAN yashil bo'lardi.
  # Coolify esa deploy'da repozitoriyni klon qiladi va serverning GitHub bilan
  # aloqasi vaqti-vaqti bilan uziladi — natijada deploy yiqilib, konteynerlar
  # Exited holatda qolar, PROD TUSHIB QOLARDI, CI esa yashil ko'rinardi.
  # Endi skript holatni kuzatadi va yiqilsa qayta uradi (qarang:
  # .github/scripts/coolify-deploy.sh).
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # COOLIFY_* secretlar + DEPLOY_ENABLED=true repo Variable qo'yilgach ishlaydi.
    # Aks holda SKIP bo'ladi (CI yashil qoladi) — buni pastdagi deploy-skipped job'i
    # KO'RINADIGAN ogohlantirish bilan belgilaydi.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    # Qayta urinishlar tufayli eng yomon holatda uzoq davom etishi mumkin —
    # nazoratdan chiqqan job daqiqalarni yeb qo'ymasin.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy stack (trigger + kuzatish + qayta urinish)
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          # Coolify "finished" desa-yu konteyner ko'tarilmasa, buni faqat
          # mustaqil sog'liq tekshiruvi ushlaydi.
          HEALTH_URL: ${{ vars.VITE_SITE_URL || 'https://protektor.uz' }}/api/v1/settings/public
          # Raw-compose resursda `true`: compose repodan Coolify'ga yuboriladi, server
          # repozitoriyni klon qilmaydi. Repo Variable COOLIFY_SYNC_COMPOSE bilan yoqiladi.
          SYNC_COMPOSE: ${{ vars.COOLIFY_SYNC_COMPOSE || 'false' }}
          # Compose'ni yuborish (PATCH) uchun yozish huquqli token; deploy tokeni yetmaydi.
          COOLIFY_WRITE_TOKEN: ${{ secrets.COOLIFY_WRITE_TOKEN }}
        run: |
          chmod +x .github/scripts/coolify-deploy.sh
          .github/scripts/coolify-deploy.sh

  # DEPLOY_ENABLED yo'q/o'chiq bo'lsa deploy JIMGINA skip bo'lardi — aynan "prodga
  # chiqmagani sezilmadi" holatining yana bir yo'li. Endi run sahifasida ogohlantirish.
  deploy-skipped:
    name: Deploy skipped (DEPLOY_ENABLED)
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED != 'true'
    steps:
      - run: |
          echo "::warning title=Deploy o'tkazib yuborildi::Repo Variable DEPLOY_ENABLED='true' emas — image'lar push qilindi, lekin Coolify deploy chaqirilmadi. Bu push PRODGA CHIQMADI."

  # ── Muvaffaqiyatsizlik xabari ──
  # Qizil CI deploy'ni skip qiladi va hech narsa o'chmaydi — 2026 avgustda yetti
  # commit ikki kun shu tarzda prodga chiqmay qolgan. Endi master'dagi har qanday
  # yiqilish Telegram'ga boradi (repo Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID;
  # bo'lmasa bu job jimgina o'tadi).
  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, build-and-push, deploy]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    steps:
      - name: Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALERT_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")')
          text="🔴 CI yiqildi (${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}): ${failed}%0A${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}%0ADeploy SKIP bo'ldi — prod eski holatda."
          curl -s --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            --data-urlencode "text=${text}" > /dev/null || true
