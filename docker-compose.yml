# Coolify'siz oddiy VPS uchun stack (port 80 ochadi). Coolify varianti: infra/coolify/docker-compose.yml
# Ishga tushirish: docker compose pull && docker compose up -d
# Rollback: IMAGE_TAG=<sha yoki vX.Y.Z> docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shina_epr_db}
      POSTGRES_USER: ${DB_USERNAME:-shina_epr_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shina_epr_user} -d ${DB_NAME:-shina_epr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  # Kunlik pg_dump (03:00 Toshkent), 14 kun saqlanadi. Tiklash: DEPLOY.md.
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-shina_epr_db}
      PGUSER: ${DB_USERNAME:-shina_epr_user}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Tashkent
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups_data:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        while true; do
          now=$$(date +%s)
          target=$$(date -d "$$(date +%Y-%m-%d) 03:00:00" +%s)
          if [ "$$target" -le "$$now" ]; then target=$$((target + 86400)); fi
          sleep $$((target - now))
          file="/backups/$${PGDATABASE}_$$(date +%F_%H%M).sql.gz"
          if pg_dump --no-owner --no-privileges | gzip > "$$file"; then
            echo "backup OK: $$file"
          else
            echo "backup FAILED: $$file"; rm -f "$$file"
          fi
          find /backups -name '*.sql.gz' -mtime +"$${BACKUP_KEEP_DAYS}" -delete
        done

  backend:
    image: ghcr.io/shavkatbegmatov/shina-epr-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-shina_epr_db}
      DB_USERNAME: ${DB_USERNAME:-shina_epr_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # `admin` boshlang'ich paroli. Bo'sh bo'lsa tasodifiy generatsiya qilinib logga yoziladi.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # Brauzer Origin'i uchun ruxsat (vergul bilan bir nechta bo'lishi mumkin)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://protektor.uz}
      # Rasm storage — quyidagi volume'ga yoziladi (deploy'da yo'qolmasligi uchun)
      SHOP_STORAGE_DIR: /data/uploads
      # To'lov (jonli qilganda)
      PAYME_ENABLED: ${PAYME_ENABLED:-false}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      CLICK_ENABLED: ${CLICK_ENABLED:-false}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      SHOP_RETURN_URL: ${SHOP_RETURN_URL:-}
      # Xabarnoma (jonli qilganda)
      SHOP_NOTIFY_SMS: ${SHOP_NOTIFY_SMS:-false}
      SHOP_NOTIFY_EMAIL: ${SHOP_NOTIFY_EMAIL:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-off}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SHOP_PUBLIC_BASE_URL: ${SHOP_PUBLIC_BASE_URL:-https://protektor.uz}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8183/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1024M}

  frontend:
    image: ghcr.io/shavkatbegmatov/shina-epr-front:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # nginx /api ni shu stack'dagi backend servisiga proxy qiladi
      BACKEND_HOST: backend
      BACKEND_PORT: 8183
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:
  backups_data:
