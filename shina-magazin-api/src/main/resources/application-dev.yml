spring:
  config:
    # Lokal sirlar repoga tushmasin: shu papkadagi gitignore'langan `.env` fayli
    # (`DB_PASSWORD=...` qatori) bo'lsa o'qiladi. Ilgari haqiqiy DB paroli shu yerda
    # ochiq turardi va git tarixida qoldi — uni DB'da almashtiring.
    import: optional:file:./.env[.properties]
  datasource:
    # localhost - Windows/IntelliJ uchun, 172.17.0.1 - WSL uchun
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/shina_epr_db
    username: ${DB_USERNAME:shina_epr_user}
    # Haqiqiy parol .env yoki DB_PASSWORD env'da; bu faqat yangi klon uchun default.
    password: ${DB_PASSWORD:shina_epr_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  # Demo ma'lumotlar Flyway orqali avtomatik yuklanmaydi. Ular Sozlamalar
  # sahifasidagi boshqariladigan seed/cleanup endpointlari orqali yaratiladi.

# DEV-ONLY imzo kaliti — lokal ishlab chiqish uchun, JWT_SECRET o'rnatilmagan bo'lsa.
# Prod'da bu fayl YUKLANMAYDI (profil `prod`), u yerda JWT_SECRET majburiy.
# Bu kalit repoda ochiq — hech qachon prod'da ishlatilmasin.
jwt:
  secret: ${JWT_SECRET:JyhYCX/C4dqsliMYHB635TPrujj0WEY+IglVoEWmwvA=}

logging:
  level:
    uz.shinamagazin: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
