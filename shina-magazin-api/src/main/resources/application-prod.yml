# Production profil (Coolify). Faollashtirish: Dockerfile ENTRYPOINT'da
# -Dspring.profiles.active=prod (yoki SPRING_PROFILES_ACTIVE=prod env).
# Barcha ulanish/sirlar ENV'dan — qattiq yozilgan kreditsial YO'Q.
# Boshqa shop.* (storage/payment/notify) va jwt base application.yml'da env-driven.
# Traefik/nginx ortida ishlaydi — X-Forwarded-Proto/Host'ga ishonish
# (og:image kabi absolyut URL'lar https bo'lishi va scheme aniqlanishi uchun)
#
# `native` (Tomcat RemoteIpValve), `framework` (Spring ForwardedHeaderFilter) EMAS.
# Sabab — xavfsizlik: ForwardedHeaderFilter getRemoteAddr() ni X-Forwarded-For
# ning BIRINCHI qiymatiga o'rnatadi, uni esa MIJOZ yuboradi. Ya'ni hujumchi
# har so'rovda soxta IP yozib, login rate limitini butunlay chetlab o'ta olardi
# (har urinish "yangi IP" bo'lib ko'rinardi). Bu ClientIpTest'da o'lchangan.
#
# RemoteIpValve XFF ni o'ngdan chapga yuradi, `internal-proxies` ga mos kelgan
# ishonchli manzillarni o'tkazib yuboradi va birinchi ISHONCHSIZ manzilni oladi.
# Traefik Docker tarmog'ida (172.16/12) turgani uchun Tomcat'ning standart
# internalProxies ro'yxati (10/8, 172.16/12, 192.168/16, 127/8) yetarli.
# Valve X-Forwarded-Proto va X-Forwarded-Host'ni ham qayta ishlaydi, shuning
# uchun absolyut URL'lar avvalgidek to'g'ri quriladi.
server:
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shina_epr_db}
    username: ${DB_USERNAME:shina_epr_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  # Vault va Cloud tekshiruvlarini o'chirish (Coolify env ishlatiladi, tashqi Vault yo'q)
  cloud:
    vault:
      enabled: false
    compatibility-verifier:
      enabled: false

# Production logging — faqat muhim loglar
logging:
  level:
    root: WARN
    uz.shinamagazin: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# OpenAPI/Swagger prod'da O'CHIQ: ilgari /api/api-docs autentifikatsiyasiz barcha
# endpointlar va DTO'larni (xodim marshrutlari bilan) qaytarardi.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
