spring:
  application:
    name: shina-magazin-api

  # server.shutdown=graceful bilan juftlikda: joriy so'rovlar uchun kutish muddati
  lifecycle:
    timeout-per-shutdown-phase: 20s

  profiles:
    active: dev

  # Timezone - Toshkent vaqti
  jackson:
    time-zone: Asia/Tashkent
    date-format: yyyy-MM-dd HH:mm:ss

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # Ataylab yoqiq qoldirilgan: ko'plab response mapper'lar LAZY bog'lanishlarga
    # tranzaksiyadan tashqarida tegadi. O'chirish uchun avval har bir ro'yxat
    # so'roviga @EntityGraph kerak (N+1 tuzatishida boshlangan, hali to'liq emas).
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Tashkent
        # LAZY assotsiatsiyalarni to'plab yuklash — N+1 ga qarshi asosiy himoya.
        # Barcha @ManyToOne proksilari va @OneToMany kolleksiyalari bir so'rovda
        # 50 tagacha guruhlanadi: 20 ta savdo uchun mahsulotlarni olish 60 ta
        # so'rov o'rniga 1-2 ta bo'ladi. @EntityGraph aniq ro'yxatlar uchun
        # qo'shimcha optimallashtirish; bu esa qolgan HAMMA joyni qamrab oladi.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    # baseline-on-migrate ATAYLAB o'chiq: tarix jadvali yo'q bo'sh bo'lmagan bazada
    # Flyway jimgina "baseline" qilib BARCHA migratsiyalarni tashlab ketardi, ilova esa
    # o'zi qurmagan sxema ustida ishga tushardi. Yangi baza bo'sh bo'ladi — baseline kerak emas.
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    locations: classpath:db/migration

  # Multipart (rasm upload) — shop.storage.max-size-bytes bilan mos bo'lsin
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: 8183
  servlet:
    context-path: /api
  # Deploy paytida boshlangan so'rovlar (masalan POS savdosi) uzilmasin:
  # yangi so'rovlar qabul qilinmaydi, joriylari 20 s ichida yakunlanadi.
  shutdown: graceful
  # JSON javoblarni siqish — nginx faqat o'z statik fayllarini gzip qiladi,
  # proxy orqali kelgan API javoblari siqilmasdan ketardi.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

# Actuator: faqat health, tafsilotsiz. SecurityConfig qolgan /actuator/** ni denyAll qiladi.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# JWT Configuration
# `secret` uchun DEFAULT QIYMAT YO'Q — ataylab. Ilgari bu yerda ishlaydigan base64
# kalit turardi, ya'ni JWT_SECRET o'rnatilmagan har qanday deployment uchun repo
# ko'ra oladigan har kim token soxtalashtira olardi (fail-open). Endi kalit
# berilmasa ilova ishga TUSHMAYDI. Dev uchun default application-dev.yml'da.
# Generatsiya: openssl rand -base64 32
jwt:
  secret: ${JWT_SECRET}
  # Access token 30 daqiqa (ilgari 24 soat). Har so'rov baribir sessions jadvalidan
  # tekshiriladi, ya'ni qisqa muddat hech narsani sekinlashtirmaydi — lekin sizib
  # ketgan tokenning yashash oynasini 48 barobar qisqartiradi. Frontend'ning uchala
  # klienti single-flight refresh qiladi, foydalanuvchi buni sezmaydi.
  expiration: ${JWT_ACCESS_EXPIRATION_MS:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

# Ilova xavfsizlik sozlamalari
app:
  security:
    # V2/V3 seed'idagi ommaviy parollarni (admin123/seller123) ishga tushishda
    # avtomatik almashtirish — `DefaultCredentialGuard`. Dev profilida ishlamaydi.
    default-credentials:
      rotate: ${DEFAULT_CREDENTIALS_ROTATE:true}
      # `admin` uchun boshlang'ich parol. O'rnatilsa — parol logga TUSHMAYDI (tavsiya etiladi).
      # Bo'sh bo'lsa, tasodifiy parol generatsiya qilinib WARN logga bir marta yoziladi.
      admin-password: ${ADMIN_INITIAL_PASSWORD:}

# CORS — ruxsat etilgan origin'lar (vergul bilan ajratilgan).
# Prod'da CORS_ALLOWED_ORIGINS env orqali beriladi (masalan https://protektor.uz).
# Brauzer har bir POST'ga Origin yuboradi; proxy ortida scheme farqi tufayli
# same-origin so'rov ham CORS tekshiruvidan o'tadi — ro'yxatda bo'lishi shart.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5183,http://localhost:3000,http://127.0.0.1:5183,http://192.168.1.33:5183}

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging
logging:
  level:
    root: INFO
    uz.shinamagazin: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.web.access: DEBUG
    org.springframework.security.access: DEBUG

# Storefront (/) to'lov sozlamalari. DEFAULT: O'CHIQ (enabled=false).
# Yoqish: tegishli provayder merchant kreditsiallarini env yoki shu yerga qo'ying
# va enabled=true qiling. Webhook URL'lari (provayder kabinetida ro'yxatdan o'tkazing):
#   Payme:  https://<domain>/api/v1/payments/payme
#   Click:  https://<domain>/api/v1/payments/click/prepare  va  .../complete
shop:
  # Storefront'ning ommaviy manzili. Telegram boti mijozga "kabinetga kirish"
  # havolasini shundan yasaydi — noto'g'ri qolsa mijoz PIN'ini oladi-yu,
  # qayerga kiritishni bilmaydi. Prod: https://protektor.uz
  public-base-url: ${SHOP_PUBLIC_BASE_URL:http://localhost:5183}
  # Mijozga buyurtma xabarnomalari (SMS asosiy, email ixtiyoriy). DEFAULT: O'CHIQ.
  # Jonli: SMS uchun provider impl + kreditsial; email uchun spring.mail.* (env) + email.enabled (A-guruhi).
  notify:
    sms:
      enabled: ${SHOP_NOTIFY_SMS:false}
      provider: ${SHOP_NOTIFY_SMS_PROVIDER:log}
    email:
      enabled: ${SHOP_NOTIFY_EMAIL:false}
      from: ${SHOP_NOTIFY_EMAIL_FROM:Protektor <no-reply@protektor.uz>}
      subject-prefix: "Protektor — buyurtma"
  # Mahsulot rasm saqlash (lokal-fayl tizimi). Coolify: `dir`ni persistent volume'ga
  # mount qiling (env SHOP_STORAGE_DIR) — aks holda deploy'da yuklangan rasmlar yo'qoladi.
  storage:
    dir: ${SHOP_STORAGE_DIR:./uploads}
    public-base-url: ${SHOP_STORAGE_PUBLIC_BASE_URL:/api/uploads}
    max-size-bytes: ${SHOP_STORAGE_MAX_SIZE:5242880}
  payment:
    return-url: ${SHOP_RETURN_URL:http://localhost:5183/buyurtma}
    payme:
      enabled: ${PAYME_ENABLED:false}
      merchant-id: ${PAYME_MERCHANT_ID:}
      key: ${PAYME_KEY:}
      checkout-url: https://checkout.paycom.uz
    click:
      enabled: ${CLICK_ENABLED:false}
      merchant-id: ${CLICK_MERCHANT_ID:}
      service-id: ${CLICK_SERVICE_ID:}
      secret-key: ${CLICK_SECRET_KEY:}
      pay-url: https://my.click.uz/services/pay

# Telegram xabarnomalari.
# Token ATAYLAB faqat muhit o'zgaruvchisidan: u botning to'liq kaliti, shuning
# uchun app_settings'da (sozlamalar API'sida ko'rinadigan, audit jurnaliga
# tushadigan joyda) saqlanmaydi. Chat ID va yoqish/o'chirish esa sozlamalarda.
# Bo'sh bo'lsa xabar yuborilmaydi — funksiya jimgina o'chiq turadi.
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

  # Mijozlar bot orqali ro'yxatdan o'tishi uchun bot KIRISH xabarlarini ham
  # eshitishi kerak. Buning ikki yo'li bor va tanlov deployment'ga bog'liq:
  #
  #   off      — bot javob bermaydi (default). Chiquvchi xabarnomalar ishlayveradi.
  #   polling  — `getUpdates` bilan so'rab turadi. Ommaviy manzil KERAK EMAS,
  #              shuning uchun localhost/dev uchun yagona ishlaydigan variant.
  #   webhook  — Telegram o'zi POST qiladi. Prod uchun to'g'ri: doimiy so'rov yo'q.
  #              Ommaviy HTTPS + `webhook-url` + `webhook-secret` majburiy.
  mode: ${TELEGRAM_MODE:off}

  # Faqat webhook rejimi uchun. URL context-path (/api) bilan birga:
  #   https://protektor.uz/api/v1/telegram/webhook
  webhook-url: ${TELEGRAM_WEBHOOK_URL:}
  # Telegram uni har bir so'rovda `X-Telegram-Bot-Api-Secret-Token` sarlavhasida
  # qaytaradi. BUSIZ webhook manzilini topgan istalgan odam soxta "kontakt"
  # yuborib, begona raqamni o'z Telegramiga bog'lab olardi — shuning uchun
  # sirsiz webhook rejimi umuman ishga tushmaydi.
  # Generatsiya: openssl rand -hex 32
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

  # getUpdates long-polling kutish vaqti (sekund). HTTP read timeout bundan
  # katta qilib olinadi (TelegramApiClient).
  poll-timeout-seconds: ${TELEGRAM_POLL_TIMEOUT:25}
