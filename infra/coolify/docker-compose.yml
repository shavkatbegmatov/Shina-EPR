# Coolify uchun prod stack (Compose resource sifatida ulanadi).
# Image'lar GITHUB ACTIONS'da quriladi va GHCR'dan tortiladi — serverda
# build YO'Q (minimal yuklama). Private image'lar uchun serverda bir marta:
#   docker login ghcr.io -u shavkatbegmatov -p <PAT read:packages>
# ENV'lar Coolify UI'da beriladi: DB_PASSWORD, JWT_SECRET (majburiy);
# PAYME_*/CLICK_*/SHOP_* — jonli to'lov/xabarnoma yoqilganda;
# TELEGRAM_* — bot va mijoz ro'yxatdan o'tishi yoqilganda (qarang: DEPLOY.md).
# Telegram webhook'i frontend domeni orqali keladi (nginx /api → backend),
# ya'ni backend'ni tashqariga ochish SHART EMAS.
# Domen Coolify UI'da faqat frontend'ga biriktiriladi (port 80, TLS avtomatik,
# Traefik) — backend tashqariga ochilmaydi, nginx /api ni ichki tarmoqda proxy qiladi.

services:
  # Nomlar NOYOB (shina-*): Coolify'ning umumiy tarmog'ida boshqa loyihalarda ham
  # `db`/`backend` nomli servislar bor, Docker DNS nomni ulardan biriga hal qilib
  # nginx 502 berardi (07.09.2026, raw compose'ga o'tishda). `frontend` nomi
  # qoladi — domen unga bog'langan.
  shina-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shina_epr_db}
      POSTGRES_USER: ${DB_USERNAME:-shina_epr_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shina_epr_user} -d ${DB_NAME:-shina_epr_db}"]
      interval: 5s
      timeout: 3s
      retries: 12

  shina-backend:
    image: ghcr.io/shavkatbegmatov/shina-epr-api:latest
    pull_policy: always
    environment:
      # SPRING_PROFILES_ACTIVE=prod Dockerfile ENTRYPOINT'da
      DB_HOST: shina-db
      DB_NAME: ${DB_NAME:-shina_epr_db}
      DB_USERNAME: ${DB_USERNAME:-shina_epr_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # `admin` boshlang'ich paroli. Bo'sh bo'lsa tasodifiy generatsiya qilinib logga yoziladi.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # Brauzer Origin'i uchun ruxsat (vergul bilan bir nechta bo'lishi mumkin)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://protektor.uz}
      # Rasm storage — volume'ga yoziladi (deploy'da yo'qolmaydi)
      SHOP_STORAGE_DIR: /data/uploads
      # To'lov (jonli qilganda) — Coolify env'dan
      PAYME_ENABLED: ${PAYME_ENABLED:-false}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      CLICK_ENABLED: ${CLICK_ENABLED:-false}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      SHOP_RETURN_URL: ${SHOP_RETURN_URL:-}
      # Xabarnoma (jonli qilganda)
      SHOP_NOTIFY_SMS: ${SHOP_NOTIFY_SMS:-false}
      SHOP_NOTIFY_EMAIL: ${SHOP_NOTIFY_EMAIL:-false}
      # Telegram bot tokeni — MAXFIY, shuning uchun faqat env'da.
      # Chat ID va yoqish/o'chirish ERP sozlamalar sahifasidan boshqariladi.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Mijozlarning bot orqali ro'yxatdan o'tishi (kiruvchi xabarlar).
      # `off` (default) — bot javob bermaydi; prod uchun `webhook`.
      # Webhook siri MAXFIY: usiz hujumchi soxta "kontakt" yuborib, istalgan
      # raqamni o'z Telegramiga bog'lab olardi — shuning uchun sirsiz rejim
      # umuman ishga tushmaydi.
      TELEGRAM_MODE: ${TELEGRAM_MODE:-off}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Bot xabaridagi "kabinetga kirish" havolasi shu manzildan yasaladi
      SHOP_PUBLIC_BASE_URL: ${SHOP_PUBLIC_BASE_URL:-https://protektor.uz}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      shina-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8183/api/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # Kunlik zaxira: baza dump'i VA uploads arxivi.
  #
  # Nega kerak: 03.09–10.09.2026 orasida avtomatik backup umuman yo'q edi (sidecar
  # 03.09 da qo'shilib, prod tushganda compose bilan birga qaytarib olingan).
  # Coolify'ning o'z jadvalli backup'i bu bazaga tegishli emas: u faqat mustaqil
  # database resurslari uchun, compose ichidagi `shina-db` esa `/api/v1/databases/`
  # da "not found" (10.09.2026 da API'dan tekshirilgan).
  #
  # Uploads ham arxivlanadi: DB dump faqat rasm YO'LLARINI saqlaydi, fayl baytlarini
  # emas — ya'ni dump bilan rasmlarni tiklab bo'lmaydi.
  #
  # Vaqt UTC'da hisoblanadi (22:00 UTC = 03:00 Toshkent): alpine'da tzdata yo'q,
  # BusyBox `date -d` esa GNU sintaksisini tushunmaydi. Shuning uchun sana
  # arifmetikasi emas, yarim tundan o'tgan soniyalar bo'yicha kutish.
  shina-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: shina-db
      PGDATABASE: ${DB_NAME:-shina_epr_db}
      PGUSER: ${DB_USERNAME:-shina_epr_user}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # Shu kundan eski nusxalar o'chiriladi
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups_data:/backups
      - uploads_data:/uploads:ro
    depends_on:
      shina-db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        backup() {
          ts=$$(date -u +%Y-%m-%d_%H%M)
          f="/backups/db_$${ts}.sql.gz"
          if pg_dump --no-owner --no-privileges | gzip > "$$f"; then
            echo "backup OK: $$f ($$(du -h "$$f" | cut -f1))"
          else
            echo "backup FAILED: $$f"; rm -f "$$f"
          fi
          u="/backups/uploads_$${ts}.tar.gz"
          if tar czf "$$u" -C /uploads . ; then
            echo "uploads OK: $$u ($$(du -h "$$u" | cut -f1))"
          else
            echo "uploads FAILED: $$u"; rm -f "$$u"
          fi
          find /backups -name '*.gz' -mtime +"$${BACKUP_KEEP_DAYS}" -delete
        }
        # Har deploy'dan keyin DARHOL bitta nusxa: shunda "backup ishlayaptimi"
        # savoliga javob 03:00 ni kutmasdan ko'rinadi va migratsiyadan oldin
        # doim yaqin nusxa bo'ladi.
        backup
        while true; do
          secs=$$(( 10#$$(date -u +%H) * 3600 + 10#$$(date -u +%M) * 60 + 10#$$(date -u +%S) ))
          target=79200
          if [ "$$secs" -lt "$$target" ]; then
            sleep $$(( target - secs ))
          else
            sleep $$(( 86400 - secs + target ))
          fi
          backup
        done

  frontend:
    image: ghcr.io/shavkatbegmatov/shina-epr-front:latest
    pull_policy: always
    # Traefik (Coolify proksisi) qaysi portga ulanishini ANIQ aytamiz. Bu yozilmasa
    # Coolify o'z standartini oladi (ports_exposes=3000) va proksi nginx'ning 80-porti
    # o'rniga 3000 ga uradi: konteynerlar sog'lom, sayt esa 502. 06.09.2026 da Coolify
    # 4.3.17 yangilanishidan keyingi birinchi deploy'da aynan shu bo'ldi (~2 soat).
    expose:
      - "80"
    environment:
      # nginx /api ni shu servisga proxy qiladi (Docker DNS)
      BACKEND_HOST: shina-backend
      BACKEND_PORT: 8183
    depends_on:
      - shina-backend
    # nginx:alpine'da busybox wget bor. 127.0.0.1 ATAYLAB: `localhost` alpine'da
    # avval ::1 ga hal bo'ladi, nginx esa faqat IPv4'da tinglaydi — 07.09.2026 da
    # `localhost` bilan yozilgan healthcheck konteynerni unhealthy qilib, Traefik
    # uni chiqarib tashladi (sayt 503, ~10 daqiqa, revert bilan tiklandi).
    # Image ichida tekshirilgan: 127.0.0.1 -> OK, localhost -> connection refused.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

# Volume'lar oddiy e'lon qilinadi: Coolify Service turi ularni resurs
# identifikatori bilan nomlaydi (`<service-uuid>_postgres-data`).
#
# Ilgari bu yerda `external: true` + eski resursning volume nomi turardi — maqsad
# resurs almashganda ma'lumotni saqlab qolish edi. 07.09.2026 migratsiyasi shuni
# ko'rsatdi: **Service turi bu e'lonni E'TIBORSIZ qoldiradi** va baribir o'z
# volume'ini yaratadi. Dalil: pinning turgan holda yangi service birinchi deploy'da
# BO'SH baza bilan ko'tarildi (katalogda 10 ta demo mahsulot, 22 ta emas), ya'ni
# eski volume'ga ulanmagan. Ma'lumot keyin qo'lda ko'chirildi.
#
# Ya'ni pinning hech narsa qilmasdi, faqat chalg'itardi va eski volume'lar
# o'chirilgach "external volume not found" xatosiga aylanishi mumkin edi.
volumes:
  postgres_data:
  uploads_data:
  backups_data:
